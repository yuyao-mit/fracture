# Shared defaults for every experiment. Override per-experiment as needed.

run:
  family: baseline          # baseline | hybrid
  task: fracture
  seed: 0

data:
  input_steps: 4
  rollout_steps: 1
  infer_latent_variable: true
  nan_channel: 9
  include_partial: false
  samples_cache_dir: /pscratch/sd/y/yu_yao/MyQuota/fracture_experiments/dataset_cache

training:
  batch_size: 8
  epochs: 200
  lr: 1.0e-4
  weight_decay: 1.0e-5
  num_workers: 4
  ckpt_every: 10
  device: cuda

eval:
  batch_size: 16
  num_workers: 4

wandb:
  enabled: true
  project: fracture
  mode: offline             # PSC compute nodes can't reach api.wandb.ai; sync logs after the run with `wandb sync`
  tags: []
